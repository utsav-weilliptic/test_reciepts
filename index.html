<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f2; color: #202520; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; padding: 44px; background: white; border: 1px solid #e5e9e3; border-radius: 20px; box-shadow: 0 18px 50px rgba(28, 46, 31, .06); }
    .mark { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 38px; border-radius: 14px; background: #244c38; color: white; font-size: 22px; font-weight: 700; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.04em; }
    .intro { margin: 0 0 32px; color: #758076; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input { display: block; width: 100%; height: 49px; margin-bottom: 22px; padding: 0 14px; border: 1px solid #dce2dc; border-radius: 9px; font: inherit; color: inherit; }
    input::placeholder { color: #a3ada4; }
    input:focus-visible, button:focus-visible { outline: 3px solid #b2d6bc; outline-offset: 2px; }
    button { width: 100%; height: 49px; margin-top: 5px; border: 0; border-radius: 9px; background: #244c38; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #193d2a; }
    .message { margin: 20px 0 0; color: #526459; font-size: 14px; line-height: 1.5; }
    .footer { margin: 32px 0 0; text-align: center; color: #a0aaa1; font-size: 12px; }
    @media (max-width: 480px) { main { padding: 32px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your account.</p>
    <div>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

      <button id="sign-in" type="button">Sign in</button>
      <p class="message" id="message" role="status"></p>
    </div>
    <p class="footer">A little space for everything you need.</p>
  </main>
  <script>
    document.getElementById('sign-in').addEventListener('click', function () {
      if (!document.getElementById('email').reportValidity() || !document.getElementById('password').reportValidity()) return;
      document.getElementById('message').textContent = 'Sign-in is not connected yet.';
    });
  </script>
</body>
</html>
